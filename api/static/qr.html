<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan to try Nudgely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#123D35;--ink:#E8F3EE;--muted:#B1C9BC;--lime:#D2EF9B}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--brand);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:16px}
  .wrap{display:flex;gap:6vw;align-items:center;max-width:1200px;width:100%;justify-content:center;flex-wrap:wrap}
  .copy{max-width:520px}
  .brand{font-size:26px;font-weight:700;letter-spacing:-1px}.brand span{color:var(--lime)}
  h1{font-size:clamp(34px,5vw,64px);line-height:1.05;letter-spacing:-.04em;margin:18px 0 18px}
  h1 em{font-style:normal;color:var(--lime)}
  ol{padding-left:1.2em;margin:0;font-size:clamp(16px,1.6vw,21px);line-height:1.8;color:var(--muted)}
  ol b{color:var(--ink);font-weight:600}
  .qr{background:#fff;border-radius:28px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .qr img{display:block;width:min(70vw,440px,62vh);height:auto}
  @media (max-width:900px){.wrap{gap:20px}.qr img{width:min(80vw,380px,42vh)}h1{margin:10px 0}}
  .url{margin-top:14px;text-align:center;font-size:clamp(14px,1.4vw,18px);color:var(--muted);word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="copy">
    <div class="brand">nudgely<span>↗</span></div>
    <h1>Scan and chat with <em>Kampung Fresh</em></h1>
    <ol>
      <li><b>Scan</b> with your phone camera</li>
      <li><b>Ask</b> anything a customer would: durian, oat milk, a late delivery</li>
      <li><b>Watch</b> the AI tag your message and reply in seconds</li>
    </ol>
  </div>
  <div>
    <div class="qr"><img src="/qr.svg" alt="QR code that opens the Kampung Fresh demo chat"></div>
    <div class="url">{{TRY_URL}}</div>
  </div>
</div>
</body>
</html>
